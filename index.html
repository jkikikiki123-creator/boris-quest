:root{
  --bg:#1b1324;--panel:#2e2238;--panel2:#3a2c46;--deep:#140e1b;--o:#0f0a14;
  --ink:#f6ead2;--muted:#b4a2c0;--faint:#7a6886;
  --gold:#f2c14e;--gold-d:#b0782a;--gold-l:#ffe39a;
  --red:#d0402f;--red-d:#8a2218;--red-l:#f07a5a;--neg:#ff7a6a;--up:#8fe07a;
  --f:'Tiny5','Courier New',monospace;--fh:'PS2P','Tiny5',monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--f);font-size:18px;font-synthesis:none;line-height:1.3;min-height:100vh;-webkit-font-smoothing:none;
  background-color:var(--bg);background-size:24px 24px;image-rendering:pixelated}
canvas,img.pi{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
#app{position:relative;max-width:560px;margin:0 auto;padding:12px 14px 40px;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,textarea{font:inherit;color:var(--ink)}
b{font-weight:700}
img.pi{flex:none}

/* pixel frame: notched corners via 4 offset shadows */
.pf{position:relative;background:var(--panel);margin:3px;
  box-shadow:inset 0 3px 0 0 rgba(255,255,255,.07),inset 0 -3px 0 0 rgba(0,0,0,.28),
    0 -3px 0 0 var(--o),0 3px 0 0 var(--o),-3px 0 0 0 var(--o),3px 0 0 0 var(--o),0 7px 0 0 rgba(0,0,0,.35)}
.pf.gold-edge{box-shadow:inset 0 3px 0 0 rgba(255,255,255,.07),inset 0 -3px 0 0 rgba(0,0,0,.28),
    0 -3px 0 0 var(--gold-d),0 3px 0 0 var(--gold-d),-3px 0 0 0 var(--gold-d),3px 0 0 0 var(--gold-d),0 7px 0 0 rgba(0,0,0,.4)}

/* pixel buttons */
.pb{--c:var(--gold);--cd:var(--gold-d);--cl:var(--gold-l);--tc:#2a1808;
  display:flex;align-items:center;justify-content:center;gap:10px;width:calc(100% - 6px);margin:3px;padding:13px 14px 15px;
  background:var(--c);color:var(--tc);font-family:var(--fh);font-size:13px;line-height:1.3;text-transform:uppercase;
  box-shadow:inset 0 -4px 0 0 var(--cd),inset 0 3px 0 0 var(--cl),0 -3px 0 0 var(--o),0 3px 0 0 var(--o),-3px 0 0 0 var(--o),3px 0 0 0 var(--o),0 7px 0 0 rgba(0,0,0,.4)}
.pb:active{transform:translateY(3px);box-shadow:inset 0 4px 0 0 var(--cd),0 -3px 0 0 var(--o),0 3px 0 0 var(--o),-3px 0 0 0 var(--o),3px 0 0 0 var(--o)}
.pb.red{--c:var(--red);--cd:var(--red-d);--cl:var(--red-l);--tc:#fff1e6}
.pb.dark{--c:var(--panel2);--cd:#241a2e;--cl:#4c3b5c;--tc:var(--gold-l)}
.pb.small{padding:8px 12px 10px;font-size:11px;width:auto}
.pb.danger{--tc:var(--neg)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.two .pb{width:auto}

.title-bar{display:flex;align-items:center;gap:10px;margin:2px 0 12px}
.title-bar h1{flex:1;margin:0;font-family:var(--fh);font-size:22px;line-height:1;color:var(--gold);letter-spacing:.06em;text-shadow:3px 3px 0 var(--o),0 3px 0 var(--o)}
.title-bar .sub{display:block;font-family:var(--f);font-size:16px;color:var(--muted);letter-spacing:.12em;text-shadow:2px 2px 0 var(--o);margin-top:4px}
.sq{width:46px;height:46px;flex:none;padding:0}
.sq img{margin:auto}

.section{display:flex;align-items:center;gap:10px;margin:24px 0 12px;color:var(--gold);font-size:17px;letter-spacing:.14em;text-transform:uppercase;text-shadow:2px 2px 0 var(--o)}

/* roster list */
.roster{display:grid;gap:12px}

  box-shadow:inset 0 -3px 0 var(--gold-d),inset 0 2px 0 var(--gold-l),0 -2px 0 0 var(--o),0 2px 0 0 var(--o),-2px 0 0 0 var(--o),2px 0 0 0 var(--o)}

.foot{text-align:center;color:var(--faint);font-size:14px;margin-top:24px}

/* character */
.banner{position:relative;margin:-12px -14px 0}
.banner .back{position:absolute;top:10px;left:10px;z-index:3}

.hero-name h2{margin:0;font-family:var(--fh);font-size:20px;line-height:1.3;line-height:1;color:var(--ink);text-shadow:3px 3px 0 var(--o)}

.board{padding:22px 14px 16px;margin-top:26px}
.tag{position:absolute;top:-14px;left:50%;transform:translateX(-50%);background:var(--gold);color:#2a1808;font-family:var(--fh);font-size:10px;line-height:1.6;padding:2px 10px 4px;white-space:nowrap;
  box-shadow:inset 0 -2px 0 var(--gold-d),0 -2px 0 0 var(--o),0 2px 0 0 var(--o),-2px 0 0 0 var(--o),2px 0 0 0 var(--o)}
.board-top{display:flex;align-items:center;gap:16px}

  clip-path:polygon(0 0,100% 0,100% 70%,85% 70%,85% 82%,70% 82%,70% 92%,55% 92%,55% 100%,45% 100%,45% 92%,30% 92%,30% 82%,15% 82%,15% 70%,0 70%);

.lab{font-size:14px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
.xp-total{display:flex;align-items:center;gap:8px;font-family:var(--fh);font-size:24px;margin:6px 0 4px;line-height:1.05;color:var(--gold);text-shadow:3px 3px 0 var(--o)}
.prof{font-size:16px;color:var(--muted);margin-top:4px}
.prof b{color:var(--ink)}
.bar-legend{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-top:8px}
.to-next{text-align:center;margin:12px 0 14px;font-size:18px}

.log-head{font-size:14px;letter-spacing:.14em;color:var(--gold);text-align:center;margin:20px 0 6px;text-transform:uppercase}
.log{list-style:none;margin:0;padding:0}

.x{flex:none;width:34px;height:34px;display:grid;place-items:center}
[data-confirm].armed{width:auto;padding:4px 10px 6px;background:var(--red);color:#fff1e6;font-size:14px;white-space:nowrap;box-shadow:inset 0 -3px 0 var(--red-d)}
.link{display:block;margin:10px auto 0;color:var(--gold);font-size:16px;text-decoration:underline;text-underline-offset:4px}
.list-box{padding:4px 12px}

.menu{display:grid;gap:12px}
.row-btn{display:flex;align-items:center;gap:14px;width:calc(100% - 6px);padding:12px;text-align:left}
.row-btn .ic{flex:none;width:52px;height:52px;display:grid;place-items:center;background:var(--deep);box-shadow:inset 0 -3px 0 rgba(0,0,0,.4),0 0 0 2px var(--o)}

.back{display:inline-flex;align-items:center;gap:6px;padding:6px 12px 8px 8px;background:var(--panel2);color:var(--gold-l);font-size:16px;
  box-shadow:inset 0 -3px 0 #241a2e,0 -2px 0 0 var(--o),0 2px 0 0 var(--o),-2px 0 0 0 var(--o),2px 0 0 0 var(--o)}
.top-row{margin:4px 0 8px}

.coin-board{text-align:center;padding:24px 14px 20px}
.coin-board img{margin:0 auto;animation:bob 1.2s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-6px)}}

.eat{margin-top:16px}

.gold-total{font-family:var(--fh);font-size:32px;color:var(--gold);margin-top:14px;line-height:1;text-shadow:4px 4px 0 var(--o)}
.center{text-align:center}
.field{display:block;width:calc(100% - 6px);margin:3px;background:var(--deep);border:0;padding:12px 14px;font-size:19px;outline:none;color:var(--ink);border-radius:0;
  box-shadow:inset 0 3px 0 rgba(0,0,0,.45),0 -3px 0 0 var(--o),0 3px 0 0 var(--o),-3px 0 0 0 var(--o),3px 0 0 0 var(--o)}
.field:focus{box-shadow:inset 0 3px 0 rgba(0,0,0,.45),0 -3px 0 0 var(--gold),0 3px 0 0 var(--gold),-3px 0 0 0 var(--gold),3px 0 0 0 var(--gold)}
.field::placeholder{color:var(--faint)}
.field.big{font-family:var(--fh);font-size:22px;text-align:center;color:var(--gold)}
.field + .field,.chips + .field{margin-top:12px}

.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 3px 6px;scrollbar-width:none;margin-top:6px}
.chips::-webkit-scrollbar{display:none}

.chip{flex:none;white-space:nowrap;padding:5px 10px 7px;font-size:15px;color:var(--muted);background:var(--panel2);
  box-shadow:inset 0 -3px 0 #241a2e,0 -2px 0 0 var(--o),0 2px 0 0 var(--o),-2px 0 0 0 var(--o),2px 0 0 0 var(--o);margin:2px}
.chip.on{background:var(--rc,var(--gold));color:#1b1208;box-shadow:inset 0 -3px 0 rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.35),0 -2px 0 0 var(--o),0 2px 0 0 var(--o),-2px 0 0 0 var(--o),2px 0 0 0 var(--o)}

/* honor */
.gods{display:grid;gap:14px}

  box-shadow:inset 0 -3px 0 #241a2e,0 -2px 0 0 var(--o),0 2px 0 0 var(--o),-2px 0 0 0 var(--o),2px 0 0 0 var(--o)}

  box-shadow:inset 4px 0 0 var(--c),inset 0 -3px 0 #241a2e,0 -2px 0 0 var(--o),0 2px 0 0 var(--o),-2px 0 0 0 var(--o),2px 0 0 0 var(--o);margin:2px}

.inline{display:flex;gap:8px;margin-top:6px;align-items:stretch}
.inline .field{flex:1}
.inline .pb{width:auto;margin:3px}

/* items */
.rar-sum{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;margin:16px 0 4px;font-size:15px;color:var(--muted)}

.item{display:flex;align-items:center;gap:12px;width:calc(100% - 6px);padding:10px;text-align:left}

/* parchment */
.statblock{position:relative;margin:6px 3px 10px;padding:16px 16px 18px;color:#2a1d12;background:#ecdcb4;
  box-shadow:inset 0 4px 0 #f8ecd0,inset 0 -4px 0 #c9b083,inset 4px 0 0 #f3e5c2,inset -4px 0 0 #d6c093,
    0 -3px 0 0 var(--o),0 3px 0 0 var(--o),-3px 0 0 0 var(--o),3px 0 0 0 var(--o),0 8px 0 0 rgba(0,0,0,.4)}

.sb-desc{font-size:17px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}

/* sheet */
.backdrop{position:fixed;inset:0;z-index:50;background:rgba(10,6,14,.72);animation:fade .15s steps(3)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:560px;margin:0 auto;max-height:calc(var(--tg-viewport-height,100vh)*.9);overflow:auto;overscroll-behavior:contain;
  background:var(--panel);padding:14px 16px calc(22px + env(safe-area-inset-bottom));
  box-shadow:inset 0 4px 0 var(--panel2),0 -4px 0 0 var(--o),0 -8px 0 0 var(--gold-d);animation:up .22s steps(6)}

.sheet-who{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:16px;margin-bottom:4px}
.sheet label,.flabel{display:block;font-size:14px;letter-spacing:.12em;color:var(--muted);margin:16px 0 6px;text-transform:uppercase}

  box-shadow:inset 0 -3px 0 #241a2e,0 -2px 0 0 var(--o),0 2px 0 0 var(--o),-2px 0 0 0 var(--o),2px 0 0 0 var(--o);margin:2px}

.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;width:calc(100% - 6px);margin:16px 3px 0;padding:10px 12px 12px;background:var(--panel2);

.toggle.on .sw::after{left:25px;background:var(--gold)}

.pm .field{flex:1}

/* level up */
.lvlup{position:fixed;inset:0;z-index:80;display:grid;place-items:center;overflow:hidden;text-align:center;padding:20px;background:#140e1b;animation:fade .3s steps(4)}

  background:repeating-conic-gradient(rgba(242,193,78,.16) 0 10deg,transparent 10deg 20deg);animation:spin 8s steps(16) infinite}

@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}


/* readable text (dnd.su-like) */
.rd{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans',sans-serif;-webkit-font-smoothing:antialiased;font-synthesis:weight style;letter-spacing:0}

/* patches */
.patches{display:grid;gap:12px;margin-top:16px}
.patch{display:block;width:calc(100% - 6px);padding:12px 14px 14px;text-align:left}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}

<script>
/* ===== Pixel sprite engine + Caldora heroes ===== */
const PX = (() => {
const W = 28, H = 33, FR = 8;
const OUT = '#120c16';

function SB(W, H){
  W = W || 28; H = H || 33;
  const g = Array.from({length:H}, () => Array(W).fill(null));
  let mir = false;
  const set = (x,y,k) => { if (x>=0 && x<W && y>=0 && y<H) g[y][x] = k; };
  const api = {
    g,
    mir(v){ mir = v; return api; },
    p(x,y,k){ set(x,y,k); if (mir) set(W-1-x,y,k); return api; },
    ps(k, pts){ pts.forEach(([x,y]) => api.p(x,y,k)); return api; },
    r(x,y,w,h,k){ for (let j=0;j<h;j++) for (let i=0;i<w;i++) api.p(x+i,y+j,k); return api; },
    hl(x1,x2,y,k){ for (let x=x1;x<=x2;x++) api.p(x,y,k); return api; },
    vl(x,y1,y2,k){ for (let y=y1;y<=y2;y++) api.p(x,y,k); return api; },
    ell(cx,cy,rx,ry,k){ for (let y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++) for (let x=Math.floor(cx-rx);x<=Math.ceil(cx+rx);x++){ const a=(x-cx)/rx, b=(y-cy)/ry; if (a*a+b*b<=1.05) api.p(x,y,k); } return api; },
    th(x0,y0,x1,y1,r,k){ const n=Math.max(1,Math.ceil(Math.hypot(x1-x0,y1-y0)*2)); for (let i=0;i<=n;i++) api.circ(x0+(x1-x0)*i/n, y0+(y1-y0)*i/n, r, k); return api; },
    poly(pts,k){ const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]); for (let y=Math.floor(Math.min(...ys));y<=Math.ceil(Math.max(...ys));y++) for (let x=Math.floor(Math.min(...xs));x<=Math.ceil(Math.max(...xs));x++){ const px=x+.5, py=y+.5; let ins=false; for (let i=0,j=pts.length-1;i<pts.length;j=i++){ const [xi,yi]=pts[i],[xj,yj]=pts[j]; if (((yi>py)!==(yj>py)) && (px < (xj-xi)*(py-yi)/(yj-yi)+xi)) ins=!ins; } if (ins) api.p(x,y,k); } return api; },
    c(x,y){ set(x,y,null); if (mir) set(W-1-x,y,null); return api; },
    // filled circle
    circ(cx,cy,rad,k){ for (let y=Math.floor(cy-rad);y<=Math.ceil(cy+rad);y++) for (let x=Math.floor(cx-rad);x<=Math.ceil(cx+rad);x++){ const dx=x-cx,dy=y-cy; if (dx*dx+dy*dy <= rad*rad+0.3) api.p(x,y,k); } return api; },
    ring(cx,cy,rad,k){ for (let y=Math.floor(cy-rad);y<=Math.ceil(cy+rad);y++) for (let x=Math.floor(cx-rad);x<=Math.ceil(cx+rad);x++){ const d=Math.sqrt((x-cx)**2+(y-cy)**2); if (d<=rad+0.5 && d>rad-0.7) api.p(x,y,k); } return api; },
  };
  return api;
}

// shared body bits
function face(s, o){
  s.mir(true);
  s.r(9,3,5,1,'s').r(8,4,6,9,'s').r(9,13,5,1,'s');
  s.vl(8,9,12,'S').hl(9,13,13,'S');
  if (o.ears === 'point'){ s.ps('s',[[7,8],[7,9],[6,7],[5,6]]).ps('S',[[7,9]]); }
  else if (o.ears !== false){ s.ps('s',[[7,8],[7,9]]).p(7,9,'S'); }
  s.p(11,8,'e').p(11,9,'e');
  if (o.shine) s.p(11,8,o.shine);
  s.mir(false);
  if (o.mouth !== false) s.hl(13,14,11,'m');
  s.mir(true).r(12,14,2,1,'S').mir(false);
}
function legs(s, pant, boot, opt){
  opt = opt || {};
  s.mir(true);
  s.r(10,24,3,5,pant);
  s.r(9,29,4,3,boot).hl(9,12,29,opt.cuff||boot);
  s.mir(false);
}

const HEROES = {};

/* ---------------- Ландер Хэрзир ---------------- */
HEROES.lander = {
  pal:{
    s:'#e2aa82', S:'#b97b5c', e:['#1b1420','#1b1420','#1b1420','#1b1420','#1b1420','#b97b5c','#1b1420','#1b1420'], m:'#8f5440',
    h:'#2a1d17', H:'#4e3829', b:'#a77558',
    c:'#4d5260', C:'#353843', k:'#6b7282', t:'#262a3a', T:'#353a50', g:'#e0ab45',
    l:'#6b4426', p:'#3b302b', B:'#241a15', o:'#2a1e1b', O:'#5a463c',
    r:['#c4561e','#e98a2e','#ffc35a','#e98a2e'], R:['#e98a2e','#ffc35a','#e98a2e','#c4561e']
  },
  draw(s){
    // cloak behind legs
    s.mir(true).r(7,22,4,6,'C').mir(false);
    legs(s,'p','B');
    face(s,{});
    // hair
    s.mir(true).r(9,1,5,1,'h').r(8,2,6,2,'h').r(7,3,2,4,'h').mir(false);
    s.hl(9,18,4,'h').ps('h',[[10,5],[11,5],[16,5],[17,5],[18,5],[18,6]]).ps('H',[[11,2],[12,2],[13,2],[10,3],[11,3]]);
    // stubble
    s.mir(true).r(9,11,5,2,'b').r(9,13,5,1,'S').p(9,10,'b').mir(false);
    s.hl(12,15,11,'m');
    // hood bunched + cloak
    s.mir(true).r(8,14,6,2,'c').hl(9,13,14,'k').r(7,16,3,8,'c').vl(9,16,23,'C').vl(7,16,23,'k').mir(false);
    s.r(10,16,8,8,'t').vl(13,16,23,'T');
    s.ps('g',[[14,17],[14,19],[14,21]]);
    s.hl(10,17,22,'l').p(14,22,'g');
    // right hand at side
    s.hl(19,20,23,'s').p(20,24,'S');
    // left hand holding orb
    s.hl(6,9,22,'s').p(9,21,'s');
    s.circ(6.5,19,2.6,'o');
    s.ps('O',[[5,17],[4,18]]);
    s.ps('r',[[6,18],[7,19],[5,20],[8,18]]).ps('R',[[6,20],[7,21],[4,19]]);
  }
};

/* ---------------- Ксир (дроу) ---------------- */
HEROES.ksir = {
  pal:{
    s:'#5d6272', S:'#434755', e:['#eef0ff','#eef0ff','#eef0ff','#eef0ff','#eef0ff','#434755','#eef0ff','#eef0ff'], m:'#2f313b',
    h:'#ecebf2', H:'#ffffff', d:'#b5b2c4',
    a:'#25242d', A:'#3b3a47', w:'#a8aec0', z:'#17161c', Z:'#24232b',
    p:'#2a2930', B:'#18171c', bl:'#cfd4e0', bh:'#6c5a49'
  },
  draw(s){
    // hair behind (long, falls on back)
    s.mir(true).r(5,4,4,15,'h').vl(5,6,18,'d').ps('d',[[6,19],[7,19]]).mir(false);
    legs(s,'p','B');
    face(s,{ears:'point'});
    // hair top
    s.mir(true).r(9,1,5,1,'h').r(7,2,7,3,'h').mir(false);

function evalCh(ch){

}

function lairBg(W, H){
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H; const c = cv.getContext('2d');
  let seed = 11; const R = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  const F = (x,y,w,h,col) => { c.fillStyle = col; c.fillRect(x|0,y|0,w|0,h|0); };
  const bands = ['#120a14','#170d19','#1c111e','#221423','#281726','#2e1a28'];
  for (let y=0;y<H;y++){ const i = Math.min(bands.length-1, Math.floor(y/H*bands.length)); F(0,y,W,1,bands[i]); }
  for (let i=0;i<14;i++){ const x = R()*W, r = 6+R()*14, y = 10 + R()*(H-30);
    for (let yy=-r;yy<=r;yy++) for (let xx=-r;xx<=r;xx++) if (xx*xx+yy*yy*2 <= r*r && (xx+yy)%3) F(x+xx,y+yy,1,1,'#2a1a2c'); }
  for (let x=0;x<W;x+=3+(R()*5|0)){ const h = 3 + (R()*14|0); for (let j=0;j<h;j++){ const w = Math.max(1, Math.round((1-j/h)*4)); F(x - (w>>1), j, w, 1, j < 2 ? '#4a3448' : '#3a2838'); } }
  const fy = H - 12;
  // hoard
  const hx = W*0.78;
  for (let yy=0; yy<16; yy++){ const half = Math.round((16-yy)*1.9); for (let xx=-half; xx<=half; xx++){ if (R() < 0.85) F(hx+xx, fy-yy, 1, 1, R()<0.3 ? '#ffe39a' : R()<0.5 ? '#f2c14e' : '#b0782a'); } }
  F(hx-14, fy-4, 3, 2, '#c0392b'); F(hx+9, fy-7, 2, 2, '#5a9ef0'); F(hx+3, fy-12, 2, 2, '#7ad06a');
  // floor
  F(0,fy,W,H-fy,'#3a2a30'); F(0,fy,W,1,'#6a4c56'); F(0,fy+1,W,1,'#4e3840');
  for (let i=0;i<8;i++){ const x = R()*W|0; F(x, fy+3+(R()*6|0), 2+(R()*5|0), 1, '#2a1c22'); }
  F(W*0.32, fy+1, 4, 1, '#e8e0c8'); F(W*0.33+1, fy, 1, 1, '#e8e0c8'); F(W*0.36, fy+2, 2, 1, '#e8e0c8');
  return {cv, fy, cracks: Array.from({length:6}, () => ({x:R()*W|0, y:fy+4+(R()*6|0), w:4+(R()*8|0)})), sparks: Array.from({length:8}, () => ({x:hx-14+R()*28, y:fy-R()*14}))};
}

  let h = '';
  if (NF.type === 'days') h += `<label>Дни недели</label><div class="days7">${WD.map((w,i) => `<button class="chip ${NF.days.includes(i+1)?'on':''}" data-a="nday" data-d="${i+1}">${w}</button>`).join('')}</div>`;
  if (NF.type === 'weekly') h += `<label>Сколько раз в неделю</label><div class="stepper"><button class="rnd" data-a="nstep" data-k="n" data-s="-1">${IC('minus',LT,14)}</button><b>${NF.n}</b><button class="rnd" data-a="nstep" data-k="n" data-s="1">${IC('plus',LT,14)}</button></div>`;
  else h += `<label>Сколько раз в день (слоты)</label><div class="stepper"><button class="rnd" data-a="nstep" data-k="target" data-s="-1">${IC('minus',LT,14)}</button><b>${NF.target}</b><button class="rnd" data-a="nstep" data-k="target" data-s="1">${IC('plus',LT,14)}</button></div>`;
  if (NF.stat === 'wis') h += `<button class="toggle ${NF.reflect?'on':''}" data-a="nrefl"><span>Выполнение = запись в Свитке провалов</span><span class="sw"></span></button>`;
  ex.innerHTML = h;
  const fake = {sched:{type:NF.type, days:NF.days, n:NF.n}, target:NF.target};
  const u = unitsInMonth(fake, today());
  $('#n-prev').innerHTML = `${ST(NF.stat).dn}: <b>${fmt(u*UNIT)} HP</b> · ${u} ${plural(u,'боевой день','боевых дня','боевых дней')} в месяце`;
}
function sheetReflect(chId){
  sheet(`<h3>Свиток провалов</h3>
    <div class="note-box center">Мудрость — умение принять провал. Посмотри на проблему как в окно и найди в ней плюсы.</div>
    <label>Что пошло не так?</label><textarea class="field rd" id="r-fail" style="min-height:90px" placeholder="Например: пропустил тренировку, сорвался на сладкое…"></textarea>
    <label>Какие в этом плюсы?</label><textarea class="field rd" id="r-plus" style="min-height:90px" placeholder="Что хорошего, чему научило, что теперь понятно…"></textarea>
    <label>Что сделаю иначе (необязательно)</label><input class="field rd" id="r-less" autocomplete="off">
    <button class="pb" data-a="rsave" data-id="${chId || ''}">${IC('scroll',0,24)} Записать в свиток</button>`);
}
function sheetSettings(){
  sheet(`<h3>Резервная копия</h3>
    <div class="note-box center">${CLOUD ? 'Прогресс хранится в облаке Telegram и доступен с любого твоего устройства.' : 'Прогресс хранится в этом браузере.'}</div>
    <textarea class="field" id="exp" readonly style="min-height:90px;font-size:13px;font-family:monospace">${esc(JSON.stringify(S))}</textarea>
    <button class="pb dark" data-a="copyexp">Скопировать</button>
    <label>Восстановить</label><textarea class="field" id="imp" style="min-height:80px;font-size:13px;font-family:monospace" placeholder="Вставь сюда копию"></textarea>
    <button class="pb dark" data-a="import" data-confirm>Загрузить копию</button>`);
}
function welcomeBack(ev){
  const heals = ev.filter(e => e.type === 'heal'), lost = ev.filter(e => e.type === 'lost');
  const misses = ev.filter(e => e.type === 'miss');
  if (!heals.length && !lost.length){ if (misses.length) toast(`Пропуск: «${misses[misses.length-1].ch.name}». Окно занято — сегодня не пропускай!`); return; }
  const first = heals[0];
  if (lost.length) toast(lost.map(l => `${ST(l.ch.stat).dn} улетел — бой проигран. Новый дракон уже здесь.`).join(' · '));
  if (first) showHeal(first.ch, first.v, true);
}

/* ================= ACTIONS ================= */
const ACT = {
  tab(b){ const t = b.dataset.t; detail = null; if (t === 'new'){ sheetNew(); return; } tab = t; render(); window.scrollTo(0,0); hap('sel'); },
  open(b){ detail = b.dataset.id; render(); window.scrollTo(0,0); hap('light'); },
  back: () => back(),
  closesheet: () => closeSheet(),
  strike(b){ const ch = ch$(b.dataset.id); if (!ch || !canStrike(ch)) return; if (ch.kind === 'reflect'){ sheetReflect(ch.id); return; } doStrike(ch); },
  undo(b){ const ch = ch$(b.dataset.id); if (ch && undo(ch)){ toast('Последний удар отменён'); render(); } },
  btclose(){ const after = BT && BT.after; closeBattle(); if (after === true) sheetReflect(); else if (typeof after === 'function') after(); },
  omen(){
    const t = today();
    if (S.omen && S.omen.date === t){ toast('Знамение уже брошено. Завтра — новое.'); return; }
    const r = roll(20); S.omen = {date:t, roll:r}; if (r === 20) S.insp = true; save();
    const box = document.querySelector('.omen .r'), tx = document.querySelector('.omen .t'); let i = 0;
    const iv = setInterval(() => { box.textContent = roll(20); if (++i > 10){ clearInterval(iv); render(); hap(r === 20 ? 'ok' : r === 1 ? 'warn' : 'medium'); } }, 70);
    tx.textContent = 'Кубик катится…';
  },
  reflect(){ sheetReflect(); },
  rsave(b){
    const fail = $('#r-fail').value.trim(), plus = $('#r-plus').value.trim(), lesson = $('#r-less').value.trim();
    if (!fail || !plus){ toast('Опиши провал и найди хотя бы один плюс'); hap('warn'); return; }
    S.journal.push({id:uid(), date:today(), fail, plus, lesson}); save(); closeSheet();
    const ch = (b.dataset.id && ch$(b.dataset.id)) || S.challenges.find(c => c.kind === 'reflect' && canStrike(c));
    if (ch && canStrike(ch)) doStrike(ch); else { toast('Записано в свиток. Мудрость растёт.'); render(); }
  },
  nstat(b){ NF.stat = b.dataset.k; b.parentNode.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); if (NF.stat === 'wis') NF.reflect = true; nExtra(); hap('sel'); },
  ntype(b){ NF.type = b.dataset.k; b.parentNode.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); nExtra(); hap('sel'); },
  nday(b){ const d = +b.dataset.d; NF.days = NF.days.includes(d) ? NF.days.filter(x => x !== d) : NF.days.concat(d).sort(); nExtra(); hap('sel'); },
  nstep(b){ const k = b.dataset.k, v = NF[k] + (+b.dataset.s); NF[k] = Math.max(1, Math.min(k === 'n' ? 7 : 8, v)); nExtra(); hap('sel'); },
  nrefl(b){ NF.reflect = !NF.reflect; b.classList.toggle('on', NF.reflect); },
  nsave(){
    const name = $('#n-name').value.trim(); if (!name){ toast('Назови привычку'); hap('warn'); return; }
    if (NF.type === 'days' && !NF.days.length){ toast('Выбери хотя бы один день'); return; }
    const sched = NF.type === 'daily' ? {type:'daily'} : NF.type === 'days' ? {type:'days', days:NF.days.slice()} : {type:'weekly', n:NF.n};
    const target = NF.type === 'weekly' ? 1 : NF.target, kind = NF.stat === 'wis' && NF.reflect ? 'reflect' : 'normal';
    if (NF.id){ const ch = ch$(NF.id); Object.assign(ch, {name}); ch.next = {stat:NF.stat, sched, target, kind};
      if (ch.dragon.strikes.length === 0){ Object.assign(ch, {stat:NF.stat, sched, target, kind}); delete ch.next; newDragon(ch, ch.dragon.start); }
      save(); closeSheet(); render(); toast('Сохранено'); return; }
    const ch = {id:uid(), name, stat:NF.stat, sched, target, kind, chainWins:0, wins:0, locks:0, days:{}, history:[], created:today()};
    newDragon(ch, today()); S.challenges.push(ch); save(); closeSheet(); tab = 'today'; detail = null; render();
    toast(`${ST(ch.stat).dn} прилетел! ${fmt(ch.dragon.max)} HP`); hap('ok');
  },
  edit(b){ sheetNew(b.dataset.id); },
  del(b){ S.challenges = S.challenges.filter(c => c.id !== b.dataset.id); save(); detail = null; render(); toast('Испытание удалено'); },
  setbase(b){
    const k = b.dataset.k, s = ST(k);
    sheet(`<h3>${s.n}</h3><label>Базовое значение (с листа персонажа)</label>
      <div class="stepper" style="justify-content:center"><button class="rnd" data-a="bstep" data-k="${k}" data-s="-1">${IC('minus',LT,14)}</button><b id="bval">${S.hero.base[k]}</b><button class="rnd" data-a="bstep" data-k="${k}" data-s="1">${IC('plus',LT,14)}</button></div>
      <div class="note-box center">Временные бонусы от драконов прибавятся сверху.</div><button class="pb" data-a="closesheet">Готово</button>`);
  },
  bstep(b){ const k = b.dataset.k; S.hero.base[k] = Math.max(1, Math.min(30, S.hero.base[k] + (+b.dataset.s))); $('#bval').textContent = S.hero.base[k]; save(); render(); },
  settings(){ sheetSettings(); },
  copyexp(){ const t = $('#exp'); try { navigator.clipboard.writeText(t.value).then(() => toast('Скопировано'), () => { t.select(); document.execCommand('copy'); toast('Скопировано'); }); } catch(e){ t.select(); try { document.execCommand('copy'); toast('Скопировано'); } catch(_){} } },
  import(){ let d; try { d = JSON.parse($('#imp').value); } catch(e){ toast('Не похоже на копию'); return; } if (!d || !d.hero || !Array.isArray(d.challenges)){ toast('Не похоже на копию'); return; } S = d; save(); closeSheet(); render(); toast('Прогресс восстановлен'); }
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  if (b.hasAttribute('data-confirm') && !b.classList.contains('armed')){
    b.classList.add('armed'); b._html = b.innerHTML; b.textContent = 'Точно?'; hap('warn');
    setTimeout(() => { if (b.isConnected && b.classList.contains('armed')){ b.classList.remove('armed'); b.innerHTML = b._html; } }, 3000); return;
  }
  const fn = ACT[b.dataset.a]; if (fn){ e.preventDefault(); fn(b); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') back(); });
(() => { try { const cv = document.createElement('canvas'); cv.width = 8; cv.height = 8; const c = cv.getContext('2d'); c.fillStyle = '#1b1324'; c.fillRect(0,0,8,8); c.fillStyle = '#211830'; c.fillRect(0,0,1,1); c.fillRect(4,4,1,1); document.body.style.backgroundImage = `url(${cv.toDataURL()})`; } catch(e){} })();

/* ================= START ================= */
function boot(data){
  S = data && data.hero ? data : fresh();
  // apply pending edits for next dragon
  const ev = evalAll();
  S.challenges.forEach(ch => { if (ch.next && ch.dragon.status === 'active' && ch.dragon.strikes.length === 0){ Object.assign(ch, ch.next); delete ch.next; newDragon(ch, ch.dragon.start); } });
  S.seen = today(); updateStreak(); save(); render();
  setTimeout(() => welcomeBack(ev), 500);
}
let booted = false;
const local = lsGet();
if (CLOUD){
  cloudLoad(rem => { if (booted) return; booted = true; boot(rem && (!local || (rem.updatedAt||0) >= (local.updatedAt||0)) ? rem : local); });
  setTimeout(() => { if (!booted){ booted = true; boot(local); } }, 2500);
} else { booted = true; boot(local); }
let dayKey = today();
setInterval(() => { if (!S) return; const t = today(); if (t !== dayKey){ dayKey = t; const ev = evalAll(); save(); render(); welcomeBack(ev); } }, 60000);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => S && render());
})();
</script>
</body>
